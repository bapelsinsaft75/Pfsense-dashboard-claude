<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logga in med Plex | Film Dilemma</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="stylesheet" href="/local/page.css">
</head>
<body>
<main class="card">
  <a href="/" class="brand"><img src="/favicon.svg?v=2" alt="" width="36" height="36"><span>Film Dilemma</span></a>
  <h1>Logga in</h1>
  <p class="lead">Logga in med ditt Plex-konto. Du kommer in om du har tillgång till Plex-servern.</p>
  <button id="go" class="btn primary" type="button">Logga in med Plex</button>
  <p id="msg" class="msg" role="status" aria-live="polite"></p>
  <p class="small"><a href="/">Tillbaka till startsidan</a></p>
</main>
<script>
(function () {
  var btn = document.getElementById("go");
  var msg = document.getElementById("msg");
  var params = new URLSearchParams(location.search);
  var next = params.get("next") || "/";
  if (!/^\/[^/]/.test(next) && next !== "/") next = "/";
  var popup = null;
  var polling = false;

  function show(text, isError) {
    msg.textContent = text;
    msg.className = "msg" + (isError ? " error" : "");
  }

  async function poll(pinId) {
    if (polling) return;
    polling = true;
    var started = Date.now();
    while (Date.now() - started < 5 * 60 * 1000) {
      await new Promise(function (r) { setTimeout(r, 1500); });
      var r, d;
      try {
        r = await fetch("/api/local/plex/pin/" + pinId);
        d = await r.json();
      } catch (e) { continue; }
      if (!r.ok) {
        polling = false;
        btn.disabled = false;
        show((d && d.detail) || "Inloggningen misslyckades.", true);
        if (popup) try { popup.close(); } catch (e) {}
        return;
      }
      if (d.status === "ok") {
        try {
          localStorage.setItem("access_token", d.access_token);
          localStorage.setItem("refresh_token", d.refresh_token);
          localStorage.setItem("user", JSON.stringify(d.user));
          sessionStorage.removeItem("fd-plex-pin");
        } catch (e) {}
        if (popup) try { popup.close(); } catch (e) {}
        show("Inloggad som " + d.user.username + ". Skickar dig vidare …");
        location.replace(next);
        return;
      }
    }
    polling = false;
    btn.disabled = false;
    show("Inloggningen tog för lång tid. Försök igen.", true);
  }

  btn.addEventListener("click", async function () {
    btn.disabled = true;
    show("Öppnar Plex …");
    // Öppna fönstret direkt vid klicket så att popup-blockerare släpper igenom det
    popup = window.open("about:blank", "plexauth", "width=600,height=720");
    var r = await fetch("/api/local/plex/pin", { method: "POST" });
    var d = await r.json().catch(function () { return null; });
    if (!r.ok || !d) {
      btn.disabled = false;
      if (popup) popup.close();
      show((d && d.detail) || "Kunde inte starta Plex-inloggningen.", true);
      return;
    }
    try { sessionStorage.setItem("fd-plex-pin", JSON.stringify({ id: d.id, next: next })); } catch (e) {}
    if (popup && !popup.closed) {
      popup.location.href = d.auth_url;
      show("Logga in i Plex-fönstret som öppnades …");
      poll(d.id);
    } else {
      // Ingen popup: gå till Plex i samma flik, Plex skickar tillbaka hit efteråt
      location.href = d.auth_url;
    }
  });

  // Tillbaka från Plex i samma flik (eller popupen själv landade här)
  var pin = params.get("pin");
  if (pin) {
    if (window.opener && window.opener !== window && window.name === "plexauth") {
      document.querySelector("main").innerHTML = "<p class='lead'>Klart! Du kan stänga det här fönstret.</p>";
      setTimeout(function () { window.close(); }, 500);
      return;
    }
    try {
      var saved = JSON.parse(sessionStorage.getItem("fd-plex-pin") || "null");
      if (saved && saved.next) next = saved.next;
    } catch (e) {}
    btn.disabled = true;
    show("Kontrollerar inloggningen …");
    poll(pin);
  }
})();
</script>
</body>
</html>
