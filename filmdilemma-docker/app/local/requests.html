<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Requests | Film Dilemma</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="stylesheet" href="/local/page.css">
</head>
<body>
<main class="wide">
  <header class="top">
    <a href="/" class="brand"><img src="/favicon.svg?v=2" alt="" width="32" height="32"><span>Film Dilemma</span></a>
    <nav><a href="/movies">Filmer</a><a href="/plex">Plex</a><a href="/profile">Profil</a></nav>
  </header>
  <div class="req-head">
    <h1>Requests</h1>
    <button class="btn small-btn" id="reload" type="button">Uppdatera</button>
  </div>
  <p class="lead" id="lead">Dina önskningar och hur långt de har kommit: Plex-watchlist, Seerr, nedladdning och Plex.</p>
  <nav class="libtabs" id="scope" aria-label="Visa" hidden>
    <a class="tab" href="?scope=all" data-scope="all">Alla</a>
    <a class="tab" href="?scope=mine" data-scope="mine">Mina</a>
  </nav>
  <p id="note" class="msg" role="status" aria-live="polite"></p>
  <ul id="list" class="rq"></ul>
  <p id="empty" class="msg" hidden>Du har inga önskningar än. Öppna en film eller serie som inte finns i Plex och tryck på <b>Request movie</b> eller <b>Request show</b>.</p>
</main>
<script>
(function () {
  async function refresh() {
    var rt = localStorage.getItem("refresh_token");
    if (!rt) return false;
    var r = await fetch("/api/v1/auth/refresh", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: rt }) });
    if (!r.ok) return false;
    var d = await r.json();
    localStorage.setItem("access_token", d.access_token);
    localStorage.setItem("refresh_token", d.refresh_token);
    return true;
  }
  async function api(path, opts, retried) {
    opts = opts || {};
    var h = { "Authorization": "Bearer " + (localStorage.getItem("access_token") || "") };
    var r = await fetch(path, Object.assign({}, opts, { headers: h }));
    if (r.status === 401 && !retried && await refresh()) return api(path, opts, true);
    if (r.status === 401) { location.replace("/plex-login?next=/requests"); throw new Error("401"); }
    return r;
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function fmtDate(s) {
    if (!s) return "";
    var d = new Date(/Z|[+-]\d\d:?\d\d$/.test(s) ? s : s.replace(" ", "T") + "Z");
    return isNaN(d) ? s : d.toLocaleDateString("sv-SE", { year: "numeric", month: "short", day: "numeric" });
  }
  var ICON = { done: "✓", current: "●", todo: "○", failed: "✕" };

  function render(data) {
    var list = document.getElementById("list");
    list.innerHTML = "";
    document.getElementById("note").textContent = data.note || "";
    document.getElementById("empty").hidden = data.items.length > 0;
    data.items.forEach(function (it) {
      var li = el("li", "rq-item");
      var img = el("img", "rq-poster");
      img.src = it.poster_url || "/favicon.svg?v=2"; img.alt = ""; img.loading = "lazy";
      li.appendChild(img);

      var body = el("div", "rq-body");
      var top = el("div", "rq-top");
      var title = el(it.url ? "a" : "span", "rq-title", it.title + (it.year ? " (" + it.year + ")" : ""));
      if (it.url) title.href = it.url;
      top.appendChild(title);
      top.appendChild(el("span", "rq-kind", it.media_type === "tv" ? "Serie" : "Film"));
      body.appendChild(top);
      body.appendChild(el("div", "small", "Önskad " + fmtDate(it.created_at) +
        (data.scope === "all" && it.requested_by ? " av " + it.requested_by : "")));

      var steps = el("ol", "rq-steps");
      it.stages.forEach(function (s) {
        var st = el("li", "rq-step " + s.state);
        st.appendChild(el("span", "rq-dot", ICON[s.state] || "○"));
        st.appendChild(el("span", "rq-label", s.label));
        steps.appendChild(st);
      });
      body.appendChild(steps);
      if (it.progress != null && it.progress < 100) {
        var bar = el("div", "rq-bar"); var fill = el("span");
        fill.style.width = it.progress + "%"; bar.appendChild(fill); body.appendChild(bar);
      }
      var foot = el("div", "rq-foot");
      foot.appendChild(el("span", "rq-summary", it.summary));
      if (it.seerr_url) { var a = el("a", "rq-link", "Öppna i Seerr"); a.href = it.seerr_url; a.target = "_blank"; a.rel = "noopener"; foot.appendChild(a); }
      if (it.source === "local" && (it.mine || data.is_admin)) {
        var del = el("button", "btn small-btn", "Ta bort"); del.type = "button";
        del.addEventListener("click", async function () { await api("/api/local/requests/" + it.local_id, { method: "DELETE" }); load(); });
        foot.appendChild(del);
      }
      body.appendChild(foot);
      li.appendChild(body);
      list.appendChild(li);
    });
  }

  var scope = new URLSearchParams(location.search).get("scope");

  async function load() {
    document.getElementById("note").textContent = "Hämtar status …";
    var r = await api("/api/local/requests/view?scope=" + encodeURIComponent(scope || "all"));
    var data = await r.json();
    if (data.is_admin) {
      var tabs = document.getElementById("scope");
      tabs.hidden = false;
      tabs.querySelectorAll(".tab").forEach(function (t) {
        var on = t.getAttribute("data-scope") === data.scope;
        t.classList.toggle("active", on);
        if (on) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
      });
      document.getElementById("lead").textContent = data.scope === "all"
        ? "Alla användares önskningar och hur långt de har kommit: Seerr, nedladdning och Plex."
        : "Dina önskningar och hur långt de har kommit: Seerr, nedladdning och Plex.";
    }
    render(data);
  }
  document.getElementById("reload").addEventListener("click", function () { load().catch(function () {}); });
  if (!localStorage.getItem("access_token")) location.replace("/plex-login?next=/requests");
  else load().catch(function (e) { if (e.message !== "401") document.getElementById("note").textContent = "Kunde inte hämta önskningarna."; });
})();
</script>
</body>
</html>
