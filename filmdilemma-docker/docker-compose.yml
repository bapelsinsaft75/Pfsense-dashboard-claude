services:
  filmdilemma:
    image: ghcr.io/bapelsinsaft75/filmdilemma:latest
    container_name: filmdilemma
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${DATA_PATH:-/mnt/user/appdata/filmdilemma}:/data
    networks:
      lan:
        ipv4_address: ${CONTAINER_IP:-192.168.2.50}

networks:
  # Befintligt macvlan-nätverk på värden ("br0" på Unraid). Kolla med: docker network ls
  lan:
    name: ${DOCKER_NETWORK:-br0}
    external: true
